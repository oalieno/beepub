services:
  backend:
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - books_data:/data/books
      - covers_data:/data/covers
    environment:
      DEV: "1"

  worker:
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - books_data:/data/books
      - covers_data:/data/covers
    command: ["bash", "start-worker-dev.sh"]

  beat:
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command: >
      sh -c "uv sync --frozen --no-install-project && exec uv run celery -A app.celeryapp:celery beat --loglevel=info"

  frontend:
    # Run as the built-in node user (uid 1000, matches the host user) so
    # files generated into the bind mount (e.g. src/lib/paraglide) stay
    # editable from the host. corepack is invoked directly instead of
    # `corepack enable`, which needs root to write /usr/local/bin.
    user: "node"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CI: "true"
    command: >
      sh -c "corepack pnpm install && exec corepack pnpm run dev --host 0.0.0.0 --port 3000"

volumes:
  backend_venv:
  frontend_node_modules:
