name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build images from the working tree and boot the real stack;
      # pull_policy would otherwise fetch published images.
      - name: Start the full stack
        run: PORT=8091 docker compose -p beepub-e2e -f docker-compose.yml up -d --build
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8091/api/health && exit 0
            sleep 2
          done
          echo "stack never became healthy" >&2
          docker compose -p beepub-e2e -f docker-compose.yml logs --tail 100
          exit 1
      - run: pnpm test:e2e
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8091
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p beepub-e2e -f docker-compose.yml logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # src/lib/paraglide is generated by the vite plugin and gitignored;
      # svelte-check needs it to exist before the build runs.
      - run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide --strategy localStorage cookie baseLocale
      - run: pnpm run check
      - run: >-
          pnpm exec prettier --plugin prettier-plugin-svelte
          --ignore-path .prettierignore --check
          "src/**/*.{svelte,ts,js,css}" "*.{js,ts,json}"
