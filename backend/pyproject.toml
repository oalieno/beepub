[project]
name = "beepub-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "pyjwt>=2.15.1",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.12",
    "lxml>=4.9.0",
    "six>=1.16.0",
    "Pillow>=10.4.0",
    "redis>=5.1.1",
    "httpx>=0.27.2",
    "pydantic-settings>=2.5.2",
    "pydantic[email]>=2.9.2",
    "celery[redis]>=5.4.0",
    "beautifulsoup4>=4.12.3",
    "rapidfuzz>=3.10.0",
    "structlog>=25.5.0",
    "pgvector>=0.3.6",
    "slowapi>=0.1.9",
    "mcp>=1.28.1",
    "opencc>=1.4.2",
    "mobi>=0.4.1",
]

[dependency-groups]
dev = [
    # `fastapi dev` for the lab dev server (start.sh); production runs uvicorn.
    "fastapi-cli>=0.0.34",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: runs the real app against real Postgres/Redis (tests/integration/conftest.py)",
]
# A response whose value does not match its declared type still goes out,
# with only a warning: here it fails, so the declared types stay true.
filterwarnings = ["error:Pydantic serializer warnings:UserWarning"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["app/vendor/ebooklib"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "E501",
    # ASYNC is on for what stalls every request at once: a blocking HTTP
    # call, a sleep or a subprocess inside async code. Not for a stat or a
    # short local read (230/240), which would each need a thread hop.
    "ASYNC230",
    "ASYNC240",
    # FastAPI declares dependencies as default arguments (Depends(...)).
    "B008",
]
