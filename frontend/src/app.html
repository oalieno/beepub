<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#b8860b"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#171310"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          // A theme set against the system's: the browser bar follows it
          // from the first paint (stores/theme.ts keeps it so after).
          if (t === "dark" || t === "light") {
            var bars = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < bars.length; i++) {
              bars[i].setAttribute("content", dark ? "#171310" : "#b8860b");
            }
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
