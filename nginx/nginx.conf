events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    # Do not announce the nginx version (in the Server header, on error pages).
    server_tokens off;

    # On every response: the declared type is the type (no guessing a
    # script out of something sent as text), and the address of a page
    # here — a book's id is in it — is not handed to other sites as the
    # Referer. A location that adds headers of its own does not inherit
    # these and repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Must match MAX_UPLOAD_SIZE in backend/app/services/storage.py.
    client_max_body_size 500M;

    # Text is sent compressed: the API's JSON, a book's stylesheets, the
    # pages the frontend renders. (A book's chapters: see the content
    # location below.) (The frontend's own
    # built assets arrive already compressed and are passed through;
    # covers, book files and event streams are not text and are left
    # alone.)
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/xhtml+xml
        application/atom+xml
        application/oebps-package+xml
        application/x-dtbncx+xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # nginx often sits behind a TLS-terminating proxy (Traefik, Caddy,
    # Cloudflare). Preserve the original scheme when one is forwarded —
    # the backend uses it to decide whether auth cookies get Secure.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;

        # The small cover the lists show (/covers/thumb/<id>.jpg.webp) —
        # and, for a book that has none yet, the cover itself.
        location ~ ^/covers/thumb/(?<cover>[^/]+)\.webp$ {
            root /data;
            try_files /covers/thumb/$cover.webp /covers/$cover =404;
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
        }

        # Static cover images served directly
        location /covers/ {
            alias /data/covers/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
        }

        # A book's own files, read by the reader one at a time. The
        # backend sends a chapter (and whatever else it has no name for)
        # as application/octet-stream, so that a book's page is never
        # opened as a page of this site; here, and only here, that type
        # is text worth compressing.
        location ~ ^/api/books/[^/]+/content/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            gzip_types
                application/octet-stream
                application/json
                application/javascript
                application/xml
                application/xhtml+xml
                application/oebps-package+xml
                application/x-dtbncx+xml
                image/svg+xml
                text/css
                text/plain
                text/xml;
        }

        # API proxy to backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # OPDS catalog for e-readers, at the conventional path. The backend
        # serves it on both /opds and /api/opds. `= /opds` + `/opds/` (rather
        # than a bare `/opds` prefix) so paths like /opdsfoo still reach the
        # frontend.
        location = /opds {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
        location /opds/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # MCP endpoint for AI clients (streamable HTTP, may use SSE)
        location /mcp {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # KOReader progress sync (kosync protocol)
        location /kosync/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Everything else to frontend
        location / {
            # The app's pages are not to be shown inside another site's
            # frame (a page there could trick a click through it).
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
