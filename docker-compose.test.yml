# Throwaway Postgres + Redis for the backend integration tests
# (backend/tests/integration). Ports are offset so a running dev stack
# doesn't clash, and Postgres data lives on tmpfs — nothing survives `down`.
#
#   docker compose -f docker-compose.test.yml up -d
#   cd backend
#   DATABASE_URL=postgresql+asyncpg://test:test@<docker-host>:5433/test \
#   REDIS_URL=redis://<docker-host>:6380 uv run pytest tests/integration
#
# <docker-host> is wherever your docker daemon runs — localhost, or the
# NAS IP when using a remote docker context.

# The default compose project name is the directory name, which would make
# these containers REPLACE a beepub stack running on the same daemon.
name: beepub-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
