services:
  # Every app service pairs a published image with a build context and
  # pull_policy: missing — `docker compose up` pulls the prebuilt image,
  # `docker compose up --build` builds from source instead.
  backend:
    image: ghcr.io/oalieno/beepub-backend:${BEEPUB_VERSION:-latest}
    build: ./backend
    pull_policy: missing
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beepub}:${POSTGRES_PASSWORD:-beepub}@postgres/${POSTGRES_DB:-beepub}
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    volumes:
      # Everything BeePub stores: app/ (the auto SECRET_KEY), books/,
      # covers/, illustrations/. Back this up with postgres_data.
      - data:/data
      # To import an existing Calibre library, mount it read-only here and
      # in the worker service below, then use Admin -> Calibre in the app:
      # - /path/to/calibre:/calibre:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/oalieno/beepub-backend:${BEEPUB_VERSION:-latest}
    build: ./backend
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 4g
    command: ["bash", "start-worker.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beepub}:${POSTGRES_PASSWORD:-beepub}@postgres/${POSTGRES_DB:-beepub}
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - data:/data
      # Calibre mount, same as the backend service:
      # - /path/to/calibre:/calibre:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    image: ghcr.io/oalieno/beepub-backend:${BEEPUB_VERSION:-latest}
    build: ./backend
    pull_policy: missing
    restart: unless-stopped
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.celeryapp:celery",
        "beat",
        "--loglevel=info",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beepub}:${POSTGRES_PASSWORD:-beepub}@postgres/${POSTGRES_DB:-beepub}
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    image: ghcr.io/oalieno/beepub-backend:${BEEPUB_VERSION:-latest}
    build: ./backend
    pull_policy: missing
    restart: "no"
    command: ["sh", "migrate.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beepub}:${POSTGRES_PASSWORD:-beepub}@postgres/${POSTGRES_DB:-beepub}
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      # migrate runs first, so it generates the auto SECRET_KEY when unset
      - data:/data
      # Installs from before 0.14 kept each kind in its own volume; migrate
      # moves their files into `data` on first start (and does nothing once
      # they're empty or on a fresh install). Kept here for a transition
      # period so upgrades need no manual step.
      - app_data:/legacy/app
      - books_data:/legacy/books
      - covers_data:/legacy/covers
      - illustrations_data:/legacy/illustrations
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/oalieno/beepub-frontend:${BEEPUB_VERSION:-latest}
    build: ./frontend
    pull_policy: missing
    restart: unless-stopped
    environment:
      ORIGIN: http://localhost:${PORT:-80}
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beepub}
      POSTGRES_USER: ${POSTGRES_USER:-beepub}
      # Postgres is only reachable inside the compose network, so a default
      # password is acceptable; set POSTGRES_PASSWORD to override.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beepub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beepub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: ghcr.io/oalieno/beepub-nginx:${BEEPUB_VERSION:-latest}
    build: ./nginx
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      # Serves /data/covers directly (read-only; nothing else is exposed).
      - data:/data:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  data:
  # Pre-0.14 layout, read only by migrate's one-time move (see above).
  app_data:
  books_data:
  covers_data:
  illustrations_data:
